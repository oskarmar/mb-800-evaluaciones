<!doctype html><meta charset="utf-8"><title>tmp</title>
<button id="c" style="font-size:20px">Copiar</button> <span id="s">cargando…</span>
<textarea id="t" style="width:100%;height:80vh"></textarea>
<script>
(async()=>{const s=document.getElementById('s');try{
const k=location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/');const kb=Uint8Array.from(atob(k+'='.repeat((4-k.length%4)%4)),c=>c.charCodeAt(0));
const b=new Uint8Array(await (await fetch('b.bin',{cache:'no-store'})).arrayBuffer());
const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));
const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
document.getElementById('t').value=txt;s.textContent='OK '+txt.length+' caracteres';
document.getElementById('c').onclick=async()=>{const ta=document.getElementById('t');ta.select();try{await navigator.clipboard.writeText(txt);s.textContent='Copiado (clipboard API) '+txt.length}catch(e){document.execCommand('copy');s.textContent='Copiado (execCommand) '+txt.length}};
}catch(e){s.textContent='ERROR '+e}})();
</script>
